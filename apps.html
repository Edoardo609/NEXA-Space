<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Apps</title><link rel="stylesheet" href="./styles.css?v=197"><link rel="stylesheet" href="./theme-fix.css?v=197"><link rel="stylesheet" href="./content-list.css?v=197"></head><body><header><a class="logo" href="./home.html"><span class="logoMark"></span><span class="logoText">NEXA</span></a><a class="ghost backHome" href="./home.html">← Home</a></header><main class="section"><div class="eyebrow">NEXA ECOSYSTEM</div><h1>NEXA Apps</h1><p class="sectionLead">Applicazioni ufficiali NEXA.</p><div class="nexaList" id="grid"><p>Caricamento…</p></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const proxy=u=>{if(String(u||'').startsWith('uploads/'))return '/api/file?key='+encodeURIComponent(u);try{const x=new URL(u);const p=x.pathname;const i=p.indexOf('/storage/uploads/');if(i>=0)return '/api/file?key='+encodeURIComponent(p.slice(i+'/storage/'.length));return u}catch{return u}};const parse=d=>{const s=String(d||''),m=s.match(/\[\[NEXA_APP_FILE:(.*?)\]\]/);return{file:m?.[1]?proxy(m[1].trim()):'',text:s.replace(/\s*\[\[NEXA_APP_FILE:.*?\]\]/,'').replace(/\n?Piattaforma:.*$/m,'').trim()}};
function more(id){const e=document.getElementById(id),b=document.querySelector('[data-more="'+id+'"]');const on=e.classList.toggle('short');b.textContent=on?'Altro':'Meno'}
(async()=>{const g=grid;try{const a=await fetch('/api/media?'+Date.now(),{cache:'no-store'}).then(r=>r.json());const v=a.filter(x=>x.kind==='app');g.innerHTML=v.length?v.map((x,n)=>{const z=parse(x.description),id='d'+n,cover=x.image_url?'<img class="nexaCover" src="'+esc(x.image_url)+'" onerror="this.style.display=\'none\'">':'<div class="nexaCover">📱</div>';return '<article class="nexaRow">'+cover+'<div class="nexaInfo"><span class="nexaTag">APP</span><h2>'+esc(x.title)+'</h2><p id="'+id+'" class="short">'+esc(z.text||'Nessuna descrizione')+'</p>'+(z.text.length>120?'<button class="moreBtn" data-more="'+id+'" onclick="more(\''+id+'\')">Altro</button>':'')+'</div><div class="nexaActions">'+(z.file?'<a class="primary" href="'+esc(z.file+(z.file.includes('?')?'&':'?')+'download=1')+'">⬇ Scarica</a>':'<span class="muted">File non allegato</span>')+'</div></article>'}).join(''):'<p>Nessuna app pubblicata.</p>'}catch(e){g.innerHTML='<p>Impossibile caricare le app.</p>'}})();
</script><script src="./offline.js?v=197"></script></body></html>
