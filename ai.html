<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXA AI</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./theme-fix.css"><link rel="stylesheet" href="./mobile-fix.css"><style>.aiFull{min-height:100dvh;height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}.aiTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.aiTop h1{font-size:clamp(24px,7vw,42px);margin:2px 0}.aiBack{display:inline-flex;align-items:center;gap:6px}.aiMessages{flex:1;overflow:auto;padding:18px 2px 100px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}.aiMessages .msg{max-width:900px;margin:0 auto 12px}.aiInput{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));width:auto;transform:none;z-index:50}.aiSources{display:flex;flex-direction:column;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.aiSources a{opacity:.95;display:block;cursor:pointer;text-decoration:underline;pointer-events:auto;position:relative;z-index:2;overflow-wrap:anywhere;padding:5px 2px}.msg.bot,.msg.bot p,.msg.bot li,.msg.bot h2,.msg.bot h3,.msg.bot h4{color:#fff!important}.msg.bot p{margin:0 0 13px;line-height:1.65}.msg.bot p:last-child{margin-bottom:0}.msg.bot h2,.msg.bot h3,.msg.bot h4{margin:18px 0 8px;line-height:1.25}.msg.bot h2:first-child,.msg.bot h3:first-child,.msg.bot h4:first-child{margin-top:0}.msg.bot ul,.msg.bot ol{margin:8px 0 16px;padding-left:24px;line-height:1.65}.msg.bot li{margin:6px 0}.msg.bot hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:18px 0}.msg.bot blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent,#75b8ff);background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;line-height:1.6}.aiBullet{margin:5px 0}.aiStatus{font-size:11px;letter-spacing:.12em;opacity:.7}.aiToolbar{display:flex;gap:8px;margin-top:8px;overflow:auto}.aiToolbar button{white-space:nowrap}.chatHistory{position:fixed;inset:0;z-index:100;background:rgba(3,5,14,.96);padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:none;box-sizing:border-box}.chatHistory.open{display:block}.historyHead{display:flex;justify-content:space-between;align-items:center}.historyList{overflow:auto;height:calc(100% - 65px);padding-top:12px}.historyItem{width:100%;text-align:left;margin:7px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text)}.historyItem small{display:block;opacity:.65;margin-top:5px}</style></head><body><header><a class="logo" href="./home.html"><span class="logoMark" aria-hidden="true"></span><span class="logoText">NEXA</span></a><a class="ghost aiBack" href="./home.html">← Home</a></header><main class="aiFull"><div class="aiTop"><div><div class="eyebrow">NEXA AI</div><h1>NEXA AI</h1></div><div class="aiStatus">● ONLINE</div></div><div class="aiToolbar"><button id="newChat" class="ghost" type="button">＋ Nuova chat</button><button id="historyBtn" class="ghost" type="button">💬 Chat salvate</button></div><div id="messages" class="messages aiMessages"></div><div class="chatInput aiInput"><input id="aiInput" autocomplete="off" placeholder="Chiedi qualcosa a NEXA…"><button id="sendAI" type="button" aria-label="Invia">➤</button></div></main><aside id="chatHistory" class="chatHistory"><div class="historyHead"><h2>💬 Chat salvate</h2><div style="display:flex;gap:8px"><button id="clearHistory" class="ghost" type="button">🗑️ Cancella tutte</button><button id="closeHistory" class="ghost" type="button">×</button></div></div><div id="historyList" class="historyList"></div></aside><script>const API=window.__HATCHABLE__?.api||'/api';const $=s=>document.querySelector(s),messages=$('#messages'),input=$('#aiInput'),send=$('#sendAI');const deviceId=localStorage.getItem('nexa_device_id')||('nexa-'+Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('nexa_device_id',deviceId);const profile=JSON.parse(localStorage.getItem('nexa_profile')||'null'),lang=localStorage.getItem('nexa_lang')||profile?.language||'it';const accountDisplayName=String(profile?.display_name||profile?.first_name||localStorage.getItem('nexa_account_display_name')||'').trim();let chatId=localStorage.getItem('nexa_current_chat')||('chat-'+Date.now()),history=JSON.parse(localStorage.getItem('nexa_chats')||'[]');document.documentElement.lang=lang;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){let s=esc(v).trim();s=s.replace(/\r/g,'').replace(/\s+---\s*/g,'\n---\n').replace(/\n?---\n?/g,'\n---\n').replace(/\s+(#{1,4}\s+)/g,'\n$1').replace(/\n\s*>\s*/g,'\n> ').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n{3,}/g,'\n\n');const lines=s.split('\n');let out='',para=[],ul=[],ol=[];const flush=()=>{if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[]}if(ul.length){out+='<ul>'+ul.map(x=>'<li>'+x+'</li>').join('')+'</ul>';ul=[]}if(ol.length){out+='<ol>'+ol.map(x=>'<li>'+x+'</li>').join('')+'</ol>';ol=[]}};for(let raw of lines){const line=raw.trim();if(!line){flush();continue}if(/^---+$/.test(line)){flush();out+='<hr>';continue}const h=line.match(/^(#{1,4})\s+(.+)$/);if(h){flush();const tag=['','h2','h3','h4','h4'][h[1].length];out+='<'+tag+'>'+h[2]+'</'+tag+'>';continue}const quote=line.match(/^>\s*(.+)$/);if(quote){flush();out+='<blockquote>'+quote[1]+'</blockquote>';continue}const bullet=line.match(/^[-•]\s+(.+)$/);if(bullet){if(ol.length)flush();ul.push(bullet[1]);continue}const numbered=line.match(/^\d+[.)]\s+(.+)$/);if(numbered){if(ul.length)flush();ol.push(numbered[1]);continue}if(ul.length||ol.length)flush();para.push(line)}flush();return out||'<p></p>'}function saveChat(){const existing=history.find(c=>c.id===chatId),data={id:chatId,title:existing?.title||'Nuova conversazione',updated_at:Date.now(),messages:[...messages.querySelectorAll('.msg')].map(x=>({role:x.classList.contains('user')?'user':'assistant',html:x.innerHTML}))};if(!existing)history.unshift(data);else Object.assign(existing,data);history=history.slice(0,50);localStorage.setItem('nexa_chats',JSON.stringify(history));localStorage.setItem('nexa_current_chat',chatId)}function loadChat(c){chatId=c.id;messages.innerHTML=c.messages.map(m=>'<div class="msg '+(m.role==='user'?'user':'bot')+'">'+m.html+'</div>').join('');saveChat();$('#chatHistory').classList.remove('open');messages.scrollTop=messages.scrollHeight}function deleteChat(id){history=history.filter(c=>c.id!==id);localStorage.setItem('nexa_chats',JSON.stringify(history));if(chatId===id)newChat();renderHistory()}function renderHistory(){const list=$('#historyList');list.innerHTML=history.length?history.map(c=>'<div style="display:flex;gap:8px;align-items:stretch"><button class="historyItem" data-id="'+esc(c.id)+'" style="flex:1">💬 '+esc(c.title)+'<small>'+new Date(c.updated_at).toLocaleString()+'</small></button><button class="ghost deleteChat" data-id="'+esc(c.id)+'" type="button" aria-label="Cancella chat">🗑️</button></div>').join(''):'<p>Nessuna chat salvata. ✨</p>';list.querySelectorAll('.historyItem').forEach(b=>b.onclick=()=>{const c=history.find(x=>x.id===b.dataset.id);if(c)loadChat(c)});list.querySelectorAll('.deleteChat').forEach(b=>b.onclick=()=>{if(confirm('Vuoi cancellare questa chat?'))deleteChat(b.dataset.id)})}function newChat(){chatId='chat-'+Date.now();const hello=accountDisplayName?'Ciao '+esc(accountDisplayName)+'! 😊<br><br>Nuova conversazione pronta. Come posso aiutarti? 🚀':'Ciao! 😊<br><br>Nuova conversazione pronta. Come posso aiutarti? 🚀';messages.innerHTML='<div class="msg bot">'+hello+'</div>';saveChat()}if(!messages.children.length)newChat();async function sendAI(){const q=input.value.trim();if(!q)return;send.disabled=true;input.disabled=true;messages.insertAdjacentHTML('beforeend','<div class="msg user">'+esc(q)+'</div>');input.value='';const wait=document.createElement('div');wait.className='msg bot';wait.textContent='NEXA AI sta pensando…';messages.appendChild(wait);messages.scrollTop=messages.scrollHeight;try{const r=await fetch(API+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,display_name:profile?.display_name||profile?.first_name||'',device_id:deviceId,history:[...messages.querySelectorAll('.msg')].slice(-18).filter(x=>x!==wait).map(x=>({role:x.classList.contains('user')?'user':'assistant',content:x.innerText||x.textContent||''}))})}),d=await r.json();if(!r.ok||!d.answer)throw new Error(d.error||'AI error');wait.innerHTML=fmt(d.answer);if(Array.isArray(d.citations)&&d.citations.length)wait.insertAdjacentHTML('beforeend','<div class="aiSources"><b>Fonti</b>'+d.citations.map(c=>'<a href="'+esc(c.url)+'" target="_blank" rel="noopener">🔗 '+esc(c.title||c.url)+'</a>').join('')+'</div>');const ex=history.find(c=>c.id===chatId);if(ex)ex.title=q.slice(0,55);saveChat()}catch(e){wait.textContent='NEXA AI non è temporaneamente disponibile.'}finally{send.disabled=false;input.disabled=false;input.focus();messages.scrollTop=messages.scrollHeight}}send.onclick=sendAI;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI()}};$('#newChat').onclick=newChat;$('#historyBtn').onclick=()=>{$('#chatHistory').classList.add('open');renderHistory()};$('#closeHistory').onclick=()=>$('#chatHistory').classList.remove('open');$('#clearHistory').onclick=()=>{if(confirm('Vuoi cancellare tutte le chat salvate?')){history=[];localStorage.removeItem('nexa_chats');chatId='chat-'+Date.now();localStorage.setItem('nexa_current_chat',chatId);messages.innerHTML='<div class="msg bot"><strong>NEXA AI</strong><br><br>Cronologia cancellata. Nuova conversazione pronta. ✨</div>';renderHistory();saveChat()}};saveChat();</script><script src="./site-status.js"></script><script src="./language.js"></script><script src="./home-nav.js"></script></body></html>
