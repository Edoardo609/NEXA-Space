<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA News</title><link rel="stylesheet" href="./styles.css?v=196"><link rel="stylesheet" href="./theme-fix.css?v=196"></head><body><header><a class="logo" href="./home.html"><span class="logoMark"></span><span class="logoText">NEXA</span></a><a class="ghost backHome" href="./home.html">← Home</a></header><main class="section"><div class="eyebrow">NEXA NEWSROOM</div><h1>NEXA News</h1><div class="grid" id="grid"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const a=await fetch('/api/media?'+Date.now(),{cache:'no-store'}).then(r=>r.json());const v=a.filter(x=>['news','announcement','event'].includes(x.kind));grid.innerHTML=v.length?v.map(x=>'<article class="card">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="Copertina" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:12px">':'<div style="font-size:38px;padding:14px">📰</div>')+'<span class="tag">'+esc(x.kind.toUpperCase())+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.description)+'</p></article>').join(''):'<p>Nessuna news pubblicata.</p>'}catch(e){grid.innerHTML='<p>Impossibile caricare le news.</p>'}})();
</script><script src="./offline.js?v=196"></script></body></html>
