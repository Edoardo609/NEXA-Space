<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Media</title><link rel="stylesheet" href="./styles.css?v=211"><link rel="stylesheet" href="./theme-fix.css?v=211"><link rel="stylesheet" href="./content-list.css?v=211"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:#75b8ff;color:#06101c}.tab{display:none}.tab.active{display:block}.musicActions{margin-top:10px}.musicActions button,.musicActions a{padding:10px 13px;border-radius:10px}.hiddenAudio{display:none}</style></head><body><header><a class="logo" href="./home.html"><span class="logoMark"></span><span class="logoText">NEXA</span></a><a class="ghost backHome" href="./home.html">← Home</a></header><main class="section"><div class="eyebrow">NEXA MEDIA</div><h1>Media</h1><p class="sectionLead">Video, post e musica ufficiale NEXA.</p><div class="tabs"><button class="ghost active" data-kind="video">🎬 Video</button><button class="ghost" data-kind="post">🖼️ Post</button><button class="ghost" data-kind="music">🎵 Musica</button></div><div id="video" class="tab active"><div class="nexaList"></div></div><div id="post" class="tab"><div class="nexaList"></div></div><div id="music" class="tab"><div class="nexaList"></div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=u=>{try{const x=new URL(u),m=x.pathname.match(/\/storage\/(uploads\/.*)$/);return m?m[1]:''}catch{return ''}};
const proxy=u=>{u=String(u||'');if(u.startsWith('chunked:'))return u;if(u.startsWith('uploads/'))return '/api/file?key='+encodeURIComponent(u);const k=key(u);return k?'/api/file?key='+encodeURIComponent(k):u};
const mimeFor=n=>{const e=String(n||'').split('.').pop().toLowerCase();return ({mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',m4v:'video/x-m4v',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg'})[e]||'application/octet-stream'};async function chunkBlob(ref){const key=String(ref).replace(/^chunked:/,'');const m=await fetch('/api/chunk-manifest?key='+encodeURIComponent(key),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('File non disponibile');return r.json()});const parts=[];for(const u of m.chunks){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Errore caricamento file');parts.push(await r.arrayBuffer())}return new Blob(parts,{type:m.type||mimeFor(m.name||key)})}
const mediaRef=r=>{r=String(r||'').trim();if(r.startsWith('chunked:'))return r;if(r.startsWith('uploads/manifests/'))return 'chunked:'+r;try{const p=new URL(r).pathname,m=p.match(/\/storage\/(uploads\/manifests\/[^?]+)/);return m?'chunked:'+m[1]:r}catch{return r}};
async function mediaBlob(ref){ref=mediaRef(ref);if(ref.startsWith('chunked:'))return chunkBlob(ref);const r=await fetch(proxy(ref),{cache:'no-store'});if(!r.ok)throw Error('file '+r.status);return r.blob()}
async function source(ref){return URL.createObjectURL(await mediaBlob(ref))}
const parse=d=>{const s=String(d||''),get=t=>{const a='[[NEXA_'+t+':',i=s.indexOf(a);if(i<0)return'';const j=s.indexOf(']]',i+a.length);return (j<0?s.slice(i+a.length):s.slice(i+a.length,j)).trim()};let text=s;['URL','VIDEO','AUDIO'].forEach(t=>{const a='[[NEXA_'+t+':',i=text.indexOf(a);if(i>=0){const j=text.indexOf(']]',i+a.length);text=j<0?text.slice(0,i):text.slice(0,i)+text.slice(j+2)}});return{url:get('URL'),video:get('VIDEO'),audio:get('AUDIO'),text:text.trim()}};
const cover=u=>u?proxy(u):'';
function yt(u){try{const x=new URL(u);let id='';if(x.hostname.includes('youtu.be'))id=x.pathname.split('/').filter(Boolean)[0]||'';else if(x.hostname.includes('youtube.com')){const p=x.pathname.split('/').filter(Boolean);id=x.searchParams.get('v')||(['shorts','embed','live'].includes(p[0])?p[1]:p[p.length-1])||''}return id?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0&playsinline=1':null}catch{return null}}
async function audioBlob(ref){return mediaBlob(ref)}
async function playAudio(id,b,ref){try{const a=document.getElementById(id);if(!a.dataset.loaded){b.textContent='Caricamento…';const blob=await audioBlob(ref);a.src=URL.createObjectURL(blob);a.dataset.loaded='1';a.load()}if(a.paused){await a.play();b.textContent='⏸ Pausa'}else{a.pause();b.textContent='▶ Ascolta'}a.onended=()=>b.textContent='▶ Ascolta'}catch(e){console.error(e);b.textContent='▶ Ascolta';alert('Impossibile avviare il brano.')}}
async function downloadFile(ref,name,b){try{if(b)b.textContent='Preparazione…';const blob=await audioBlob(ref),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(name||'download')+(String(name||'').includes('.')?'':'.mp3');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);if(b)b.textContent='⬇ Scarica'}catch(e){console.error(e);if(b)b.textContent='⬇ Scarica';alert('Download non disponibile')}}
async function loadVideo(id,ref,b){try{b.textContent='Caricamento video…';b.disabled=true;const v=document.getElementById(id);const blob=await mediaBlob(ref);const u=URL.createObjectURL(blob);v.src=u;v.hidden=false;v.load();await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Timeout video')),30000);v.onloadedmetadata=()=>{clearTimeout(t);ok()};v.onerror=()=>{clearTimeout(t);no(Error('Formato video non supportato'))}});b.remove();await v.play().catch(()=>{})}catch(e){console.error(e);b.textContent='Video non riproducibile';b.disabled=false}}
function row(x){const z=parse(x.description),img=cover(x.image_url),coverHtml=img?'<img class="nexaCover" src="'+esc(img)+'" alt="Copertina">':'<div class="nexaCover">'+(x.kind==='music'?'🎵':x.kind==='video'?'🎬':'🖼️')+'</div>';const id='desc'+x.id,aid='audio-'+x.id;if(x.kind==='music'){return '<article class="nexaRow musicRow">'+coverHtml+'<div class="nexaInfo"><span class="nexaTag">MUSICA</span><h2>'+esc(x.title)+'</h2><p id="'+id+'" class="short">'+esc(z.text||'Nessuna descrizione')+'</p><audio class="hiddenAudio" id="'+aid+'" preload="metadata"></audio><div class="musicActions">'+(z.audio?'<button class="primary js-play-audio" data-audio-id="'+esc(aid)+'" data-ref="'+esc(z.audio)+'">▶ Ascolta</button> <button class="ghost js-download" data-ref="'+esc(z.audio)+'" data-name="'+esc(x.title)+'">⬇ Scarica</button>':'<span class="muted">Audio non disponibile</span>')+'</div></div></article>'}let extra='',action='';if(x.kind==='video'){const e=yt(z.url);const vid='video-'+x.id;if(z.video){const vr=mediaRef(z.video);extra='<div style="margin-top:9px"><button class="primary js-play-video" data-video-id="'+esc(vid)+'" data-ref="'+esc(vr)+'">▶ Riproduci video</button><video id="'+vid+'" controls playsinline preload="metadata" hidden style="width:100%;margin-top:9px;border-radius:10px"></video></div>'}else if(e)extra='<iframe src="'+esc(e)+'" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:9px" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';else if(z.url)extra='<video controls playsinline preload="metadata" style="width:100%;margin-top:9px;border-radius:10px" src="'+esc(proxy(z.url))+'"></video>';action=z.url?'<a class="primary" target="_blank" rel="noopener" href="'+esc(z.url)+'">▶ Guarda</a>':''}return '<article class="nexaRow">'+coverHtml+'<div class="nexaInfo"><span class="nexaTag">'+esc(x.kind.toUpperCase())+'</span><h2>'+esc(x.title)+'</h2><p id="'+id+'" class="short">'+esc(z.text||'Nessuna descrizione')+'</p>'+extra+'</div><div class="nexaActions">'+action+'</div></article>'}
function toggleMore(id,b){const e=document.getElementById(id);e.classList.toggle('short');b.textContent=e.classList.contains('short')?'Altro':'Meno'}
(async()=>{try{const a=await fetch('/api/media?'+Date.now(),{cache:'no-store'}).then(r=>r.json());['video','post','music'].forEach(k=>document.querySelector('#'+k+' .nexaList').innerHTML=a.filter(x=>x.kind===k).map(row).join('')||'<p>Nessun contenuto.</p>')}catch(e){document.querySelectorAll('.nexaList').forEach(x=>x.innerHTML='<p>Impossibile caricare.</p>')}})();
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.kind).classList.add('active')});document.addEventListener('click',e=>{const p=e.target.closest('.js-play-audio');if(p)return playAudio(p.dataset.audioId,p,p.dataset.ref);const d=e.target.closest('.js-download');if(d)return downloadFile(d.dataset.ref,d.dataset.name,d);const v=e.target.closest('.js-play-video');if(v)return loadVideo(v.dataset.videoId,v.dataset.ref,v)});
</script><script src="./offline.js?v=211"></script></body></html>
