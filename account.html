<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account — NEXA Space Site</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./mobile-fix.css"><link rel="stylesheet" href="./theme-fix.css"><style>.accountPage{max-width:720px;margin:0 auto;padding:40px 20px}.accountCard{padding:28px;border:1px solid var(--line,#294764);border-radius:24px;background:rgba(7,17,29,.82);box-shadow:0 20px 60px rgba(0,0,0,.25)}.accountAvatar{width:104px;height:104px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#102238;border:1px solid #456b91;margin-bottom:14px;color:#dff5ff;font-size:28px;font-weight:800}.accountPage input,.accountPage select{width:100%;box-sizing:border-box;margin:7px 0 16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line,#294764);background:#091522;color:#eef6ff}.accountActions{display:flex;gap:10px;flex-wrap:wrap}.accountActions a,.accountActions button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.muted{color:#8fa7bd;line-height:1.6}</style></head><body><header><a class="logo" href="./home.html"><span class="logoMark" aria-hidden="true"></span><span class="logoText">NEXA</span></a><nav><a href="./home.html">Home</a><a href="./apps.html">Apps</a><a href="./ai.html">NEXA AI</a><a href="./music.html">Music</a><a href="./media.html">Media</a><a href="./projects.html">Progetti</a></nav><div class="actions"><a class="ghost" href="./account.html">Account</a></div></header><main class="accountPage"><div class="eyebrow">NEXA ACCOUNT</div><h1>Il tuo Account</h1><p class="muted">Gestisci il tuo profilo e le preferenze salvate su questo dispositivo.</p><section class="accountCard"><div id="avatar" class="accountAvatar">◉</div><label>Immagine profilo<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Nome<input id="first" autocomplete="given-name"></label><label>Cognome<input id="last" autocomplete="family-name"></label><label>Nome visualizzato<input id="display" autocomplete="nickname"></label><label>Lingua<select id="lang"><option value="it">Italiano</option><option value="en">English</option></select></label><label>Email per gli avvisi<input id="email" type="email" autocomplete="email" placeholder="solo per ricevere avvisi"></label><div class="accountActions"><button class="primary" id="save">Salva</button><a class="ghost" href="./home.html">← Torna alla Home</a></div><div id="savedMessage" aria-live="polite" style="display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(70,190,120,.18);border:1px solid #7CFFB2;color:#7CFFB2;font-weight:800;font-size:16px">✓ Informazioni salvate</div><p id="status" class="muted"></p></section></main><script src="./language.js"></script><script>(async()=>{const API=window.__HATCHABLE__?.api||'./api';let id=localStorage.getItem('nexa_device_id');if(!id){id=crypto.randomUUID?crypto.randomUUID():'nexa-'+Date.now();localStorage.setItem('nexa_device_id',id)}const $=s=>document.querySelector(s);let p={};function show(){ $('#first').value=p.first_name||'';$('#last').value=p.last_name||'';$('#display').value=p.display_name||'';$('#lang').value=p.language||'it';$('#email').value=p.email||'';$('#avatar').innerHTML=p.avatar_url?`<img src="${p.avatar_url}" alt="Immagine profilo" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:'◉'}try{const cached=JSON.parse(localStorage.getItem('nexa_profile')||'null');if(cached&&typeof cached==='object')p=cached;show()}catch(e){}try{const r=await fetch(API+'/profile?device_id='+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error('profile_'+r.status);const remote=await r.json();if(remote&&typeof remote==='object'){p=remote;localStorage.setItem('nexa_profile',JSON.stringify(p));show();$('#status').textContent=''}}catch(e){show();$('#status').textContent='Profilo disponibile in modalità locale. Puoi comunque modificare e salvare i tuoi dati.'}$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>3*1024*1024){$('#status').textContent='Immagine troppo grande (max 3 MB).';return}const r=new FileReader();r.onload=()=>{p.avatar_url=String(r.result||'');show()};r.readAsDataURL(f)};function savedToast(){let t=document.getElementById('nexaSavedToast');if(!t){t=document.createElement('div');t.id='nexaSavedToast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent='✓ Informazioni salvate';t.style.cssText='position:fixed!important;left:50%!important;bottom:28px!important;transform:translateX(-50%)!important;z-index:999999!important;background:#102238!important;color:#7CFFB2!important;border:1px solid #7CFFB2!important;border-radius:14px!important;padding:14px 22px!important;font-size:16px!important;font-weight:800!important;box-shadow:0 12px 35px rgba(0,0,0,.45)!important;display:block!important;opacity:1!important;visibility:visible!important';clearTimeout(window.__nexaToastTimer);window.__nexaToastTimer=setTimeout(()=>{t.style.display='none'},3500)}$('#save').onclick=async()=>{const btn=$('#save');const msg=$('#savedMessage');const body={device_id:id,first_name:$('#first').value.trim(),last_name:$('#last').value.trim(),display_name:$('#display').value.trim(),language:$('#lang').value,email:$('#email').value.trim(),avatar_url:p.avatar_url||'',theme:'dark',memory_enabled:p.memory_enabled!==false};/* Salva subito in locale e mostra sempre la conferma direttamente sotto Salva */localStorage.setItem('nexa_profile',JSON.stringify({...p,...body}));p={...p,...body};msg.textContent='✓ Informazioni salvate';msg.style.cssText='display:block!important;margin-top:12px!important;padding:12px 14px!important;border-radius:12px!important;background:rgba(70,190,120,.18)!important;border:1px solid #7CFFB2!important;color:#7CFFB2!important;font-weight:800!important;font-size:16px!important';btn.textContent='Salvato ✓';savedToast();try{localStorage.setItem('nexa_lang',body.language||'it');const r=await fetch(API+'/profile?device_id='+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('save_'+r.status);p=await r.json();localStorage.setItem('nexa_profile',JSON.stringify(p));show()}catch(e){/* I dati restano salvati localmente anche se il server non risponde */p={...p,...body};localStorage.setItem('nexa_profile',JSON.stringify(p));show()}finally{setTimeout(()=>{btn.textContent='Salva'},1500);clearTimeout(window.__nexaSavedMessageTimer);window.__nexaSavedMessageTimer=setTimeout(()=>{msg.style.display='none'},5000)}}})()</script><script src="./site-status.js"></script><script src="./home-nav.js"></script></body></html>
