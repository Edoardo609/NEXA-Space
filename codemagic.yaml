workflows:
  nexa-space-android:
    name: NEXA Space Android
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Cordova APK
        script: npm run build:android
    artifacts:
      - platforms/android/app/build/outputs/**/*.apk